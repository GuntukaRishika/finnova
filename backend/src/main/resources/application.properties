# Server
server.port=8080

# MySQL DataSource
# Create the database first: CREATE DATABASE finnova_db;
spring.datasource.url=jdbc:mysql://localhost:3306/finnova_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# App name
spring.application.name=finnova-backend

# JWT
# app.jwt.secret must be a Base64-encoded key of at least 256 bits (32 bytes)
app.jwt.secret=${JWT_SECRET:c+41BpdYymZBn8m1vW/LgBud0dAOqK3lv6wZKYOj+vAhC7bf9wztiV8Z/CK9mWwPG/0hcs1qOA9a+Vv02EHQ+g==}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}
