# Server
server.port=8080

# MySQL DataSource
# Create the database first: CREATE DATABASE finnova_db;
spring.datasource.url=jdbc:mysql://localhost:3306/finnova_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# App name
spring.application.name=finnova-backend

# JWT
# app.jwt.secret must be a Base64-encoded key of at least 256 bits (32 bytes)
app.jwt.secret=${JWT_SECRET:c+41BpdYymZBn8m1vW/LgBud0dAOqK3lv6wZKYOj+vAhC7bf9wztiV8Z/CK9mWwPG/0hcs1qOA9a+Vv02EHQ+g==}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# Mail (bill reminder emails)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Set EMAIL_ENABLED=true and provide MAIL_USERNAME/MAIL_PASSWORD to actually send reminder emails.
app.email.enabled=${EMAIL_ENABLED:false}
app.email.from=${MAIL_FROM:no-reply@finnova.app}

# Bill reminder scheduler (cron: sec min hour day month weekday) - runs daily at 08:00
app.bill-reminder.cron=${BILL_REMINDER_CRON:0 0 8 * * *}
app.bill-reminder.days-before=${BILL_REMINDER_DAYS_BEFORE:3}

# Receipt image upload (multipart)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=${UPLOAD_DIR:uploads}
app.upload.max-size-bytes=${UPLOAD_MAX_SIZE_BYTES:10485760}

# OCR - provider is "tesseract" (default, offline) or "google-vision" (cloud)
app.ocr.provider=${OCR_PROVIDER:tesseract}

# Tesseract: requires tesseract-ocr + trained data installed locally.
# datapath should point at the folder containing <lang>.traineddata (e.g. C:/Program Files/Tesseract-OCR/tessdata)
app.ocr.tesseract.datapath=${TESSERACT_DATAPATH:}
app.ocr.tesseract.language=${TESSERACT_LANGUAGE:eng}

# Google Vision: requires GOOGLE_APPLICATION_CREDENTIALS env var pointing at a
# service-account JSON key with Cloud Vision API access. Only used when
# app.ocr.provider=google-vision.
